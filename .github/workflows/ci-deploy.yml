name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build / e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # 添付 Excel から取り込んだ基準ルートを、CI でも再検算する。
      # 不一致が 1 件でもあればここで落ちる（データは自動修正しない）。
      - name: Validate checkout table against source Excel
        run: npm run import:checkout -- --check

      - name: Verify generated data is up to date
        run: |
          npm run import:checkout
          if ! git diff --quiet -- src/data/standardCheckoutRoutes.generated.ts; then
            echo "::error::src/data/standardCheckoutRoutes.generated.ts が Excel と同期していません。npm run import:checkout を実行してコミットしてください。"
            git --no-pager diff -- src/data/standardCheckoutRoutes.generated.ts
            exit 1
          fi

      - name: Unit tests
        run: npm run test

      # E2E はルートパス（base = /）のビルドに対して実行する
      - name: Build (for E2E)
        run: npm run build

      # E2E は base = / でしか動かないため、GitHub Pages のサブパス配信は
      # ビルド成果物の静的検証で担保する（asset / manifest / Service Worker）。
      - name: Validate GitHub Pages base path build
        run: npm run check:base

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build-pages:
    name: Build for GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # リポジトリ名からベースパスを決定する。
      # <user>.github.io 形式のリポジトリだけはルート公開なので "/" にする。
      - name: Resolve base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$(echo "$owner" | tr '[:upper:]' '[:lower:]').github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
